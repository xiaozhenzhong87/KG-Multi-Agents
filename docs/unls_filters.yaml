version: 0.3
notes:
  - "关系层维持上一版强黑名单与白名单（已内置），新增实体类型保守过滤与分组。"
  - "core_allowlist 默认启用；conditional_allowlist 可按问型开启，避免无关扩展。"
  - "type_weights 可作为节点先验（w_type），与关系权重 w_rel 叠加。"

